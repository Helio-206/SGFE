spring:
  application:
    name: sgfe
  datasource:
    url: ${SGFE_DB_URL:jdbc:mysql://localhost:3306/sgfe?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${SGFE_DB_USERNAME:sgfe_user}
    password: ${SGFE_DB_PASSWORD:sgfe_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SGFE_PORT:8080}

debug: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO

sgfe:
  branding:
    minfin-logo-url: ${SGFE_MINFIN_LOGO_URL:https://www.minfin.gov.ao/assets/img/log.png}
  security:
    jwt-secret: ${SGFE_JWT_SECRET:change-this-development-secret-change-this-development-secret}
    access-token-minutes: ${SGFE_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${SGFE_REFRESH_TOKEN_DAYS:7}
    cookie-secure: ${SGFE_COOKIE_SECURE:false}
    cookie-same-site: ${SGFE_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${SGFE_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:39117,http://127.0.0.1:39117}

management:
  endpoints:
    web:
      exposure:
        include: health,info
