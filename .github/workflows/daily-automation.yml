name: Daily Automation

on:
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      commits:
        description: 'Numero de commits a gerar nesta execucao (1-10)'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure git author
        run: |
          git config user.name "automation-bot"
          git config user.email "automation-bot@users.noreply.github.com"

      - name: Run daily updates and commit
        shell: bash
        env:
          INPUT_COMMITS: ${{ github.event.inputs.commits || '10' }}
        run: |
          commits="$INPUT_COMMITS"

          if ! [[ "$commits" =~ ^[0-9]+$ ]]; then
            commits=1
          fi

          if (( commits < 1 )); then
            commits=1
          fi

          if (( commits > 10 )); then
            commits=10
          fi

          created_commits=0

          for (( i=1; i<=commits; i++ )); do
            echo "[run] Atualizacao $i de $commits"
            node scripts/daily-update.js

            if git diff --quiet -- data/daily-snapshot.json docs/automation-log.md; then
              echo "[run] Nenhuma mudanca detectada para commit."
              continue
            fi

            git add data/daily-snapshot.json docs/automation-log.md
            git commit -m "review daily...."
            created_commits=$((created_commits + 1))
          done

          if (( created_commits > 0 )); then
            git push
          else
            echo "[run] Execucao concluida sem novos commits."
          fi
